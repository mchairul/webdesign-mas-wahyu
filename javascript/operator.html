<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var hargaMakan = 10000;
        var hargaMinum = 5000;
        var totalHarga = hargaMakan + hargaMinum;
        console.log(totalHarga);

        // operator aritmatika
        // + penambahan
        // - pengurangan
        // * perkalia
        // / pembagian
        // % modulus (sisa bagi)

        // operator lain
        // ++   increment 1
        // --   decrement 1
        
        var nilai = 10;
        nilai++;
        console.log(nilai);

        // assignment
        // =    memberi nilai / deklarasi
        // +=   nilai ditambah
        // -=   nilai dikurang
        // *=   nilai dikali
        // /=   nilai dibagi
        // %=   nilai dimodulus

        var jumlahTabungan = 0
        jumlahTabungan += 100000
        jumlahTabungan += 50000
        console.log(jumlahTabungan);
        
        console.log(100 % 7);
        
        var nilaiMod = 100
        nilaiMod %= 7
        nilaiMod %= 1.5
        console.log(nilaiMod);
        
    </script>
</body>
</html>
